name: Docker Image CI/CD (to OCIR & Deploy via SSH)

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    name: Build and Push to OCIR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Build with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Modify build file name
        run: cp ./build/libs/*SNAPSHOT.jar ./keodam-main.jar
        
      - name: Login to Oracle Cloud Infrastructure Registry (OCIR)
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login ap-chuncheon-1.ocir.io -u 'axyafvnpfykf/ocir' --password-stdin
          
      # --- OCIR 경로로 빌드 및 푸시 ---
      - name: Build and Push Docker Image to OCIR
        run: |
          docker build -t keodam .
          docker tag keodam:latest ${{ secrets.OCIR_REPOSITORY_PATH }}:latest
          docker push ${{ secrets.OCIR_REPOSITORY_PATH }}:latest

  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push # 이전 job 이름과 일치시킵니다.
    runs-on: ubuntu-latest

    steps:
      # --- AWS SSM 대신 SSH로 배포 ---
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3 # SSH 접속을 위한 인기 액션
        with:
          host: ${{ secrets.SSH_HOST }}            
          username: ${{ secrets.SSH_USERNAME }}   
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22                              
          
          # GitHub Secrets를 서버의 환경 변수로 전달
          envs: OCIR_AUTH_TOKEN, OCIR_REPOSITORY_PATH 
          
          script: |
            # --- 서버에서 실행할 스크립트 ---
            
            # 1. (서버에서) OCIR 로그인 (GitHub Secret을 환경변수로 받아 사용)
            echo $OCIR_AUTH_TOKEN | sudo docker login ap-chuncheon-1.ocir.io -u 'axyafvnpfykf/ocir' --password-stdin
            
            # 2. 최신 이미지 PULL
            sudo docker pull $OCIR_REPOSITORY_PATH:latest
            
            # 3. 기존 컨테이너 중지 (없으면 오류 방지)
            sudo docker stop keodam || true
            
            # 4. 기존 컨테이너 삭제 (없으면 오류 방지)
            sudo docker rm keodam || true
            
            # 5. 새 컨테이너 실행
            sudo docker run -d --name keodam -p 8080:8080 $OCIR_REPOSITORY_PATH:latest
